name: sync-upstream
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream into our branches
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCHES: ${{ vars.SYNC_BRANCHES }}
        run: |
          for b in $BRANCHES; do
            echo "== branche $b"
            gh api -X POST "repos/${{ github.repository }}/merge-upstream" -f branch="$b" --jq '.merge_type // .message' 2>/dev/null || echo "conflit ou branche absente : $b"
          done